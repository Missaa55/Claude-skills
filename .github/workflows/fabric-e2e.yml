name: Fabric 1.21.1 real build
on:
  push:
    paths:
      - 'examples/fabric-1211/**'
      - 'tests/test_fabric_fixture.py'
      - '.github/workflows/fabric-e2e.yml'
  pull_request:
    paths:
      - 'examples/fabric-1211/**'
      - 'tests/test_fabric_fixture.py'
      - '.github/workflows/fabric-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.3'
      - name: Validate fixture structure (static only)
        run: python3 -m unittest discover -s tests -p test_fabric_fixture.py -v
      - name: Compile and remap actual Fabric mod
        working-directory: examples/fabric-1211
        run: gradle --no-daemon --stacktrace build
      - name: Verify remapped mod JAR
        working-directory: examples/fabric-1211
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json
          jars = sorted(Path('build/libs').glob('claudeskills-block-*.jar'))
          jars = [j for j in jars if not j.name.endswith('-sources.jar') and not j.name.endswith('-dev.jar')]
          assert jars, 'No production remapped JAR'
          with zipfile.ZipFile(jars[0]) as z:
              names = set(z.namelist())
              assert 'fabric.mod.json' in names
              assert 'dev/claudeskills/ExampleMod.class' in names
              assert 'data/claudeskills_block/recipe/workshop_block.json' in names
              meta = json.loads(z.read('fabric.mod.json'))
              assert meta['id'] == 'claudeskills_block'
              assert meta['version'] == '1.0.0'
          print('VERIFIED_JAR', jars[0])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: fabric-1211-verified-mod
          path: examples/fabric-1211/build/libs/claudeskills-block-*.jar
          if-no-files-found: error
